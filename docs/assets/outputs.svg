<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 36px Arial,sans-serif;fill:#0B1F3A}
      .subtitle{font:400 18px Arial,sans-serif;fill:#506075}
      .card{rx:20;ry:20;filter:url(#shadow2);stroke:#AFC7E8;stroke-width:1.5;fill:white}
      .h{font:700 21px Arial,sans-serif;fill:#0B1F3A}
      .t{font:400 15px Arial,sans-serif;fill:#44556C}
      .file{font:600 14px 'Courier New',monospace;fill:#123A66}
      .small{font:600 14px Arial,sans-serif;fill:#204A78}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg2)"/>
  <text x="60" y="62" class="title">What SciAgentKit Produces</text>
  <text x="60" y="95" class="subtitle">Readable reports for humans, structured files for pipelines, and reproducibility records for every run.</text>

  <g>
    <rect x="60" y="150" width="300" height="265" class="card"/>
    <text x="92" y="195" class="h">Molecule audit</text>
    <text x="92" y="228" class="t">Generated-molecule or library analysis:</text>
    <text x="92" y="268" class="file">descriptors.csv</text>
    <text x="92" y="296" class="file">scaffolds.csv</text>
    <text x="92" y="324" class="file">novelty_report.csv</text>
    <text x="92" y="352" class="file">cross_duplicates.csv</text>
    <text x="92" y="387" class="small">Plus: comparison figures and summaries</text>
  </g>

  <g>
    <rect x="385" y="150" width="300" height="265" class="card"/>
    <text x="417" y="195" class="h">Protein selection</text>
    <text x="417" y="228" class="t">Mutation-aware target and structure outputs:</text>
    <text x="417" y="268" class="file">target_sequence.fasta</text>
    <text x="417" y="296" class="file">uniprot_target.csv</text>
    <text x="417" y="324" class="file">pdb_candidates.csv</text>
    <text x="417" y="352" class="file">ranked_structures.csv</text>
    <text x="417" y="387" class="small">Coverage, mutation match, resolution ranking</text>
  </g>

  <g>
    <rect x="710" y="150" width="300" height="265" class="card"/>
    <text x="742" y="195" class="h">Docking + MD</text>
    <text x="742" y="228" class="t">Screening, planning, and analysis artifacts:</text>
    <text x="742" y="268" class="file">pocket.json</text>
    <text x="742" y="296" class="file">docking_scores.csv</text>
    <text x="742" y="324" class="file">md_jobs.csv</text>
    <text x="742" y="352" class="file">rmsd.csv / rmsf.csv</text>
    <text x="742" y="387" class="small">Optional: ProLIF interaction tables</text>
  </g>

  <g>
    <rect x="1035" y="150" width="300" height="265" class="card"/>
    <text x="1067" y="195" class="h">Reports</text>
    <text x="1067" y="228" class="t">Human-readable and machine-readable deliverables:</text>
    <text x="1067" y="268" class="file">report.md</text>
    <text x="1067" y="296" class="file">final_report.docx</text>
    <text x="1067" y="324" class="file">final_report.pdf</text>
    <text x="1067" y="352" class="file">run_manifest.json</text>
    <text x="1067" y="387" class="small">Hashable provenance trail for every run</text>
  </g>

  <rect x="60" y="465" width="1275" height="85" rx="18" fill="#E9F2FF" stroke="#B8C9E6" stroke-width="1.5"/>
  <text x="92" y="512" font-family="Arial" font-size="20" font-weight="700" fill="#123A66">Figure outputs include property distributions, reference-vs-query comparisons, scaffold summaries, RMSD/RMSF curves, and interaction maps.</text>

  <g>
    <rect x="60" y="585" width="1275" height="120" rx="18" fill="#0B1F3A"/>
    <text x="92" y="632" font-family="Arial" font-size="22" font-weight="700" fill="#FFFFFF">Everything is written under a run directory.</text>
    <text x="92" y="665" font-family="Arial" font-size="17" fill="#D8E5FF">This makes batch automation easier, keeps runs isolated, and gives every agent session a clean scientific paper trail.</text>
  </g>
</svg>