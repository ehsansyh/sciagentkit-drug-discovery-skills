<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:700 34px Arial, sans-serif;fill:#0B1F3A}.subtitle{font:400 17px Arial,sans-serif;fill:#506075}
      .box{rx:18;filter:url(#shadow);stroke-width:1.4}.h{font:700 18px Arial,sans-serif;fill:#0B1F3A}.t{font:400 14px Arial,sans-serif;fill:#42526A}.small{font:600 13px Arial,sans-serif;fill:#204A78}
      .arrow{stroke:#3A6EA5;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3A6EA5"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="60" y="60" class="title">SciAgentKit Architecture</text>
  <text x="60" y="92" class="subtitle">Skills decide the workflow. MCP runs the deterministic scientific tools. Reports keep the evidence trail.</text>

  <rect x="60" y="145" width="260" height="150" fill="#FFFFFF" stroke="#B8C9E6" class="box"/>
  <text x="85" y="185" class="h">AI Agent Interface</text>
  <text x="85" y="217" class="t">Claude Code plugin</text>
  <text x="85" y="242" class="t">Codex skills + MCP</text>
  <text x="85" y="267" class="t">Gemini CLI skills + MCP</text>

  <rect x="470" y="125" width="260" height="190" fill="#F2F7FF" stroke="#7FA7D8" class="box"/>
  <text x="495" y="165" class="h">SciAgentKit Skills</text>
  <text x="495" y="197" class="t">smiles-analysis</text>
  <text x="495" y="222" class="t">generated-molecule-audit</text>
  <text x="495" y="247" class="t">protein-structure-selection</text>
  <text x="495" y="272" class="t">full-target-screening</text>
  <text x="495" y="297" class="small">Stage router + safety rules</text>

  <rect x="880" y="145" width="260" height="150" fill="#FFFFFF" stroke="#B8C9E6" class="box"/>
  <text x="905" y="185" class="h">MCP Tool Server</text>
  <text x="905" y="217" class="t">RDKit, UniProt, PDB</text>
  <text x="905" y="242" class="t">Vina, OpenMM, MDAnalysis</text>
  <text x="905" y="267" class="t">ProLIF, report generation</text>

  <path d="M320 220 C380 220, 410 220, 470 220" class="arrow"/>
  <path d="M730 220 C790 220, 820 220, 880 220" class="arrow"/>

  <rect x="150" y="390" width="900" height="130" fill="#0B1F3A" stroke="#0B1F3A" class="box"/>
  <text x="190" y="435" font-family="Arial" font-weight="700" font-size="22" fill="#FFFFFF">Local-first scientific execution</text>
  <text x="190" y="470" font-family="Arial" font-size="16" fill="#D7E6FF">No invented descriptors • run_manifest.json • output hashes • reports • reproducible folders under runs/</text>
  <text x="190" y="500" font-family="Arial" font-size="16" fill="#D7E6FF">The agent plans. The tools calculate. Scientific values remain auditable.</text>
</svg>