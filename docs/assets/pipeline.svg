<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#ECF3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3A6EA5"/>
    </marker>
    <style>
      .title{font:700 36px Arial,sans-serif;fill:#0B1F3A}
      .subtitle{font:400 18px Arial,sans-serif;fill:#506075}
      .card{rx:20;ry:20;filter:url(#shadow);stroke:#AFC7E8;stroke-width:1.5;fill:white}
      .num{font:700 18px Arial,sans-serif;fill:white}
      .h{font:700 20px Arial,sans-serif;fill:#0B1F3A}
      .t{font:400 15px Arial,sans-serif;fill:#44556C}
      .small{font:600 14px Arial,sans-serif;fill:#204A78}
      .arrow{stroke:#3A6EA5;stroke-width:3.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Target-Screening Workflow</text>
  <text x="60" y="95" class="subtitle">From a target name and ligand library to ranked structures, docking plans, MD jobs, trajectory analysis, and final reports.</text>

  <!-- row 1 -->
  <g>
    <rect x="60" y="150" width="285" height="190" class="card"/>
    <circle cx="96" cy="188" r="20" fill="#123A66"/><text x="90" y="195" class="num">1</text>
    <text x="125" y="195" class="h">Literature search</text>
    <text x="88" y="235" class="t"><tspan x="88" dy="0">Europe PMC / PubMed queries</tspan><tspan x="88" dy="24">for binding pockets, mutations,</tspan><tspan x="88" dy="24">and known ligands.</tspan></text>
    <text x="88" y="316" class="small">Outputs: literature_results.csv</text>
  </g>

  <g>
    <rect x="385" y="150" width="285" height="190" class="card"/>
    <circle cx="421" cy="188" r="20" fill="#123A66"/><text x="415" y="195" class="num">2</text>
    <text x="450" y="195" class="h">Target + PDB ranking</text>
    <text x="413" y="235" class="t"><tspan x="413" dy="0">Fetch UniProt sequence, apply</tspan><tspan x="413" dy="24">requested mutation, align PDB</tspan><tspan x="413" dy="24">chains, rank by coverage and resolution.</tspan></text>
    <text x="413" y="316" class="small">Outputs: ranked_structures.csv</text>
  </g>

  <g>
    <rect x="710" y="150" width="285" height="190" class="card"/>
    <circle cx="746" cy="188" r="20" fill="#123A66"/><text x="740" y="195" class="num">3</text>
    <text x="775" y="195" class="h">Ligand preparation</text>
    <text x="738" y="235" class="t"><tspan x="738" dy="0">Canonicalize SMILES, pick pH,</tspan><tspan x="738" dy="24">choose recommended or user</tspan><tspan x="738" dy="24">force field, generate 3D SDF.</tspan></text>
    <text x="738" y="316" class="small">Outputs: ligands_3d.sdf</text>
  </g>

  <g>
    <rect x="1035" y="150" width="285" height="190" class="card"/>
    <circle cx="1071" cy="188" r="20" fill="#123A66"/><text x="1065" y="195" class="num">4</text>
    <text x="1100" y="195" class="h">Pocket detection</text>
    <text x="1063" y="235" class="t"><tspan x="1063" dy="0">Use crystal ligand center,</tspan><tspan x="1063" dy="24">residue-defined sites, or</tspan><tspan x="1063" dy="24">fpocket-assisted pocket picking.</tspan></text>
    <text x="1063" y="316" class="small">Outputs: pocket.json</text>
  </g>

  <!-- connectors row1 -->
  <path d="M345 245 L385 245" class="arrow"/>
  <path d="M670 245 L710 245" class="arrow"/>
  <path d="M995 245 L1035 245" class="arrow"/>

  <!-- row2 -->
  <g>
    <rect x="60" y="455" width="285" height="190" class="card"/>
    <circle cx="96" cy="493" r="20" fill="#123A66"/><text x="90" y="500" class="num">5</text>
    <text x="125" y="500" class="h">Docking</text>
    <text x="88" y="540" class="t"><tspan x="88" dy="0">Create Vina configs and dock</tspan><tspan x="88" dy="24">ligands into the prepared pocket.</tspan><tspan x="88" dy="24">Select top ligands by score.</tspan></text>
    <text x="88" y="621" class="small">Outputs: docking_scores.csv</text>
  </g>

  <g>
    <rect x="385" y="455" width="285" height="190" class="card"/>
    <circle cx="421" cy="493" r="20" fill="#123A66"/><text x="415" y="500" class="num">6</text>
    <text x="450" y="500" class="h">MD planning</text>
    <text x="413" y="540" class="t"><tspan x="413" dy="0">Build OpenMM job folders with</tspan><tspan x="413" dy="24">solvation, ions, 0.15 M salt,</tspan><tspan x="413" dy="24">equilibration, and replicas.</tspan></text>
    <text x="413" y="621" class="small">Outputs: md_jobs.csv</text>
  </g>

  <g>
    <rect x="710" y="455" width="285" height="190" class="card"/>
    <circle cx="746" cy="493" r="20" fill="#123A66"/><text x="740" y="500" class="num">7</text>
    <text x="775" y="500" class="h">Trajectory analysis</text>
    <text x="738" y="540" class="t"><tspan x="738" dy="0">Compute RMSD, RMSF, and</tspan><tspan x="738" dy="24">ProLIF interaction fingerprints</tspan><tspan x="738" dy="24">when trajectories are available.</tspan></text>
    <text x="738" y="621" class="small">Outputs: rmsd.csv, rmsf.csv</text>
  </g>

  <g>
    <rect x="1035" y="455" width="285" height="190" class="card"/>
    <circle cx="1071" cy="493" r="20" fill="#123A66"/><text x="1065" y="500" class="num">8</text>
    <text x="1100" y="500" class="h">Reporting</text>
    <text x="1063" y="540" class="t"><tspan x="1063" dy="0">Write structured outputs,</tspan><tspan x="1063" dy="24">Markdown summaries, and</tspan><tspan x="1063" dy="24">DOCX/PDF reports with manifests.</tspan></text>
    <text x="1063" y="621" class="small">Outputs: report.md, final_report.pdf</text>
  </g>

  <!-- connectors row2 -->
  <path d="M345 550 L385 550" class="arrow"/>
  <path d="M670 550 L710 550" class="arrow"/>
  <path d="M995 550 L1035 550" class="arrow"/>
  <!-- down connector from 4 to 5 -->
  <path d="M1177 340 C1177 380, 1177 402, 1177 430 C1177 452, 345 452, 345 550" class="arrow"/>

  <rect x="60" y="740" width="1260" height="95" rx="18" fill="#0B1F3A"/>
  <text x="95" y="786" font-family="Arial" font-size="22" font-weight="700" fill="#FFFFFF">All stages write machine-readable outputs and a reproducibility manifest.</text>
  <text x="95" y="818" font-family="Arial" font-size="17" fill="#D8E5FF">Skills decide which stage to run. MCP tools do the calculations. Reports preserve the evidence trail.</text>
</svg>