<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B1F3A" flood-opacity="0.13"/></filter><style>.title{font:700 34px Arial,sans-serif;fill:#0B1F3A}.subtitle{font:400 17px Arial,sans-serif;fill:#506075}.box{rx:18;filter:url(#shadow);stroke-width:1.2}.h{font:700 20px Arial,sans-serif;fill:#0B1F3A}.t{font:400 15px Arial,sans-serif;fill:#42526A}.cmd{font:600 13px 'Courier New',monospace;fill:#123A66}</style></defs>
  <rect width="1200" height="560" fill="#F7FAFF"/>
  <text x="55" y="60" class="title">One Scientific Engine, Three Agent Front-Ends</text>
  <text x="55" y="92" class="subtitle">Claude, Codex, and Gemini can share the same local MCP server and stage skills.</text>
  <rect x="70" y="150" width="320" height="270" fill="#FFFFFF" stroke="#9AB8DE" class="box"/>
  <text x="100" y="195" class="h">Claude Code</text><text x="100" y="230" class="t">Best experience: plugin</text><text x="100" y="258" class="cmd">/sciagentkit:smiles-analysis</text><text x="100" y="282" class="cmd">/sciagentkit:full-target-screening</text><text x="100" y="320" class="t">Plugin bundles:</text><text x="100" y="345" class="t">skills + agent + MCP launcher</text>
  <rect x="440" y="150" width="320" height="270" fill="#FFFFFF" stroke="#9AB8DE" class="box"/>
  <text x="470" y="195" class="h">OpenAI Codex</text><text x="470" y="230" class="t">Best experience: skills + MCP</text><text x="470" y="258" class="cmd">codex mcp add sciagentkit ...</text><text x="470" y="282" class="cmd">.agents/skills/*/SKILL.md</text><text x="470" y="320" class="t">Use natural prompts:</text><text x="470" y="345" class="t">“Use SciAgentKit audit...”</text>
  <rect x="810" y="150" width="320" height="270" fill="#FFFFFF" stroke="#9AB8DE" class="box"/>
  <text x="840" y="195" class="h">Gemini CLI</text><text x="840" y="230" class="t">Best experience: skills + settings</text><text x="840" y="258" class="cmd">~/.gemini/settings.json</text><text x="840" y="282" class="cmd">.gemini/skills/*/SKILL.md</text><text x="840" y="320" class="t">Use /mcp and /skills to verify</text>
  <rect x="220" y="470" width="760" height="52" rx="16" fill="#0B1F3A"/>
  <text x="255" y="503" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF">All front-ends call the same SciAgentKit MCP tools, so outputs stay deterministic.</text>
</svg>